<line x1="1142.1538461538462" y1="792" x2="1142.1538461538462" y2="816" stroke="#6d28d9" stroke-width="3.2"/>
<text x="574" y="836" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" font-style="normal" fill="#6d28d9" text-anchor="start">output spikes</text>
<text x="1212" y="836" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="end">fires on 36 % of steps</text>
<text x="902" y="866" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" font-style="normal" fill="#475569" text-anchor="middle">Each spike lowers m by one threshold; anything above it is kept.</text>
