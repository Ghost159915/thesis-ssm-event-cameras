<rect y="78" width="1300" height="824" fill="#ffffff"/>
<text x="40" y="105" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" font-style="normal" fill="#0f172a" text-anchor="start">a</text>
<text x="66" y="105" font-family="DejaVu Sans, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" font-style="normal" fill="#0f172a" text-anchor="start">The detector, shared by all models</text>
