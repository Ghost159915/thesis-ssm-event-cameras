# =============================================================================
# Pure SSM Detector Configuration
# No CNN — Mamba handles both spatial and temporal processing
# =============================================================================

# --- Dataset (identical to hybrid — ensures fair comparison) ---
dataset:
  name: "gen1"
  root: "./data/gen1"
  num_bins: 10
  height: 240
  width: 304
  time_window_us: 50000
  num_classes: 2
  class_names: ["car", "pedestrian"]

# --- Model ---
model:
  name: "pure_ssm"               # Switch: "hybrid" or "pure_ssm"

  pure_ssm:
    patch_size: 16               # 16 → 15×19 = 285 patches (fast, good starting point)
                                 # 8  → 30×38 = 1140 patches (slower, finer detail)
    d_model: 256
    d_state: 16
    d_conv: 4
    expand: 2
    spatial_layers: 2            # BiMamba layers for spatial processing
    temporal_layers: 2           # Causal Mamba layers for temporal processing

# --- Training (same as hybrid for fair comparison) ---
training:
  batch_size: 8
  num_workers: 4
  epochs: 50
  lr: 5.0e-4                    # Slightly lower LR — pure SSM benefits from
                                 # more careful optimisation early on
  weight_decay: 1.0e-4
  lr_scheduler: "cosine"
  warmup_epochs: 5

  loss:
    cls_weight: 1.0
    box_weight: 5.0
    obj_weight: 1.0

  augmentation:
    random_flip: true
    random_crop: false

# --- Evaluation ---
evaluation:
  iou_threshold: 0.5
  conf_threshold: 0.01
  nms_threshold: 0.5

# --- General ---
device: "auto"
seed: 42
output_dir: "./outputs/pure_ssm"
log_interval: 50
