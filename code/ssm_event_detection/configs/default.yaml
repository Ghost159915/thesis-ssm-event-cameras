# =============================================================================
# SSM Event Camera Object Detection - Default Configuration
# =============================================================================

# --- Dataset ---
dataset:
  name: "gen1"
  root: "./data/gen1"            # Path to extracted Gen1 dataset
  num_bins: 10                   # Temporal bins for voxel grid (B)
  height: 240                    # Gen1 sensor height
  width: 304                     # Gen1 sensor width
  time_window_us: 50000          # Event accumulation window in microseconds (50ms)
  num_classes: 2                 # cars, pedestrians
  class_names: ["car", "pedestrian"]

# --- Model ---
model:
  name: "hybrid"                 # Switch: "hybrid" or "pure_ssm"

  # Backbone (spatial feature extractor)
  backbone:
    name: "resnet18"
    pretrained: false             # No pretrained weights (input channels differ)
    out_features: 256             # Feature dimension after backbone

  # Mamba temporal module
  mamba:
    d_model: 256                  # Model dimension (matches backbone output)
    d_state: 16                   # SSM state dimension
    d_conv: 4                     # Local convolution width
    expand: 2                     # Block expansion factor
    num_layers: 2                 # Number of stacked Mamba blocks

  # Detection head
  detection_head:
    num_classes: 2
    num_anchors: 1                # Anchor-free (1 prediction per cell)
    feat_channels: 128

# --- Training ---
training:
  batch_size: 8
  num_workers: 4
  epochs: 50
  lr: 1.0e-3
  weight_decay: 1.0e-4
  lr_scheduler: "cosine"
  warmup_epochs: 5

  # Loss weights
  loss:
    cls_weight: 1.0
    box_weight: 5.0
    obj_weight: 1.0

  # Data augmentation
  augmentation:
    random_flip: true
    random_crop: false            # Keep off for now

# --- Evaluation ---
evaluation:
  iou_threshold: 0.5             # mAP@0.5
  conf_threshold: 0.01           # Low threshold for mAP computation
  nms_threshold: 0.5

# --- General ---
device: "auto"                   # auto-detect (cuda, rocm, mps, cpu)
seed: 42
output_dir: "./outputs"
log_interval: 50                 # Print every N batches
