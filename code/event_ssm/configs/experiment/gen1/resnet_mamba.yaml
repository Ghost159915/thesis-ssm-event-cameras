# @package _global_
# Canonical (tracked) Hydra EXPERIMENT config for the drop-in ResNetMamba backbone on Gen1.
# Mirrors config/experiment/gen1/default.yaml (the MaxViTRNN baseline) but pulls in our model group
# (/model/resnet_mamba_yolox) instead of maxvit_yolox, and drops MaxViT-only knobs (partition_split_32).
# Selected at runtime exactly like the baseline:  model=rnndet +experiment/gen1=resnet_mamba
# For Hydra to find it, this file is symlinked into the (gitignored) RVT tree at
# external/ssms_event_cameras/RVT/config/experiment/gen1/resnet_mamba.yaml.
defaults:
  - /model/resnet_mamba_yolox: default

training:
  precision: 32
  max_epochs: 10000
  max_steps: 400000
  learning_rate: 0.0002
  lr_scheduler:
    use: True
    total_steps: ${..max_steps}
    pct_start: 0.005
    div_factor: 20
    final_div_factor: 10000
validation:
  val_check_interval: 10000
  check_val_every_n_epoch: null
batch_size:
  train: 8
  eval: 8
hardware:
  num_workers:
    train: 6
    eval: 2
dataset:
  train:
    sampling: 'mixed'
    random:
      weighted_sampling: False
    mixed:
      w_stream: 1
      w_random: 1
  eval:
    sampling: 'stream'
  ev_repr_name: 'stacked_histogram_dt=50_nbins=10'
  sequence_length: 21
  downsample_by_factor_2: False
  only_load_end_labels: False
