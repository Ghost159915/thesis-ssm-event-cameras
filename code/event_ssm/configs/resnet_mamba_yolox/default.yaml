# @package _global_
# Canonical (tracked) Hydra model config for the drop-in ResNetMamba backbone.
# For Hydra training (Stage 6) this is symlinked into the (gitignored) RVT config tree at
# external/ssms_event_cameras/RVT/config/model/resnet_mamba_yolox/default.yaml so that
# `model=resnet_mamba_yolox/default` composes. Mirrors maxvit_yolox/default.yaml; only the
# backbone differs.
defaults:
  - override /model: rnndet

model:
  backbone:
    name: ResNetMamba
    compile:
      enable: False
      args:
        mode: reduce-overhead
    input_channels: 20         # stacked_histogram: 2 pol x 10 bins (matches baseline gen1.yaml)
    pretrained: True
    d_state: 64                # Mamba-2 (was 16 for Mamba-1); VRAM lever -- lower to 32/16 if bs/seq grows
    num_layers_per_stage: 1
    in_stages: [2, 3, 4]       # mirror of fpn.in_stages -> temporal blocks built ONLY here (Finding §8)
  fpn:
    name: PAFPN
    compile:
      enable: False
      args:
        mode: reduce-overhead
    depth: 0.67                # round(depth * 3) == num bottleneck blocks
    in_stages: [2, 3, 4]
    depthwise: False
    act: "silu"
  head:
    name: YoloX
    compile:
      enable: False
      args:
        mode: reduce-overhead
    depthwise: False
    act: "silu"
  postprocess:
    confidence_threshold: 0.1
    nms_threshold: 0.45
