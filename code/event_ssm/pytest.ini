[pytest]
# Disable ROS Jazzy pytest plugins that leak into this conda env (Python 3.12
# packages registered as pytest11 entry-points but incompatible with Python 3.11
# and missing their `lark` dependency).  All other plugins (anyio, hydra_pytest)
# are left enabled.
markers =
    gpu: needs an idle CUDA GPU (run via the --smoke coordination, not by default)
addopts = -p no:launch_testing -p no:launch_ros -m "not gpu"
